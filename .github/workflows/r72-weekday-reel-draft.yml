name: MarketRevamp R72 Daily News Reel Draft (Never Publish)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/r78-first-fresh-reel-review.trigger']
  schedule:
    # Toronto 18:17 (EDT 22:17 UTC, EST 23:17 UTC). One schedule is
    # discarded by the timezone gate; preview only, never a public post.
    - cron: '17 22 * * *'
    - cron: '17 23 * * *'

permissions:
  contents: read

concurrency:
  group: r72-news-reel-review-only
  cancel-in-progress: false

jobs:
  create-unpublished-editorial-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REEL_ENABLED: 'false'
      REEL_UPLOAD_ENABLED: 'false'
      REEL_FIRST_LIVE_ENABLED: 'false'
      INSTAGRAM_PUBLISH_ENABLED: 'false'
      MARKETREVAMP_QUOTE_FIRST: 'false'
    steps:
      - name: Read exact date-bound one-time trigger from main
        if: github.event_name == 'push'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Confirm Toronto local hour on every day, including weekends
        id: local_day
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          from pathlib import Path
          now=datetime.now(ZoneInfo("America/Toronto"))
          if os.environ.get("GITHUB_EVENT_NAME") == "push":
              import json
              payload=json.loads(Path(".github/r78-first-fresh-reel-review.trigger").read_text())
              if payload != {"intent":"create-one-fresh-review-only-reel",
                             "toronto_date":"2026-11-21",
                             "review_attempt":8,
                             "publish_to_instagram":False,
                             "upload_to_cloudinary":False}:
                  raise SystemExit("R78 one-time fresh-review trigger mismatch")
              if now.date().isoformat() != payload["toronto_date"]:
                  raise SystemExit("R78 trigger expired; no stale news drafts")
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule" and now.hour != 18:
              with Path(os.environ["GITHUB_OUTPUT"]).open("a") as handle:
                  handle.write("run_review=false\n")
              print("Timezone duplicate schedule skipped: local hour", now.hour)
          else:
              with Path(os.environ["GITHUB_OUTPUT"]).open("a") as handle:
                  handle.write("run_review=true\n")
              print("Authorized review-only Toronto time:", now.isoformat())
          PY
      - name: Checkout tested R107-polished Reel code — read only
        if: steps.local_day.outputs.run_review == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 05e768c3fca21704324fcb70450c15136b87e363
          persist-credentials: false
      - name: Checkout authoritative publishing history — read only
        if: steps.local_day.outputs.run_review == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: publishing-history
          path: publishing-history
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.local_day.outputs.run_review == 'true'
        with:
          python-version: '3.12'
      - name: Install source and media rendering packages
        if: steps.local_day.outputs.run_review == 'true'
        run: |
          pip install -r requirements.lock
          pip install -r requirements.reel.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Fail-closed safety and format regression tests
        if: steps.local_day.outputs.run_review == 'true'
        run: |
          test "$REEL_ENABLED" = false
          test "$REEL_UPLOAD_ENABLED" = false
          test "$REEL_FIRST_LIVE_ENABLED" = false
          test "$INSTAGRAM_PUBLISH_ENABLED" = false
          python -m unittest -v test_r67_weekday_news.py test_r72_news_review.py test_reel_bookends.py test_r107_narration.py
      - name: Collect and screen seven current headlines against posting history
        if: steps.local_day.outputs.run_review == 'true'
        timeout-minutes: 10
        run: |
          python r67_weekday_news.py \
            --history publishing-history/instagram_publish_history.json \
            --output r67_review/review_sources.json
      - name: Create unpublished real-news Reel in approved R71 template
        if: steps.local_day.outputs.run_review == 'true'
        timeout-minutes: 16
        run: |
          python reel_r72_review.py \
            --sources r67_review/review_sources.json \
            --history publishing-history/instagram_publish_history.json \
            --output-dir r72_review
      - name: Assert correct source date, 9 sections and no publication
        if: steps.local_day.outputs.run_review == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          qa=json.loads(Path('r72_review/r72_qa.json').read_text())
          daily=json.loads(Path('r72_review/editorial_pending_stories.json').read_text())
          today=datetime.now(ZoneInfo('America/Toronto')).date().isoformat()
          assert qa['toronto_date'] == daily['toronto_date'] == today
          assert qa['status']=='review_only' and daily['status']=='review_only'
          assert qa['seven_scenes']==len(daily['stories'])==7
          assert qa['presentation_segments']==9
          assert qa['spoken_hook']=="Here's what's making headlines today."
          assert qa['spoken_follow_cta'].startswith('Follow MarketRevamp')
          assert qa['synthetic_content'] is False
          assert qa['real_source_headlines'] is True
          assert qa['not_independently_fact_checked'] is True
          assert qa['history_checked'] is True
          assert qa['caption_font_size_px']==80 and qa['alignment_token_ratio']>=.90
          assert qa['narration_style']=='source_headline_and_verbatim_context'
          assert qa['spoken_source_prefixes']==0
          assert qa['scene_pause_seconds']==0.16
          assert qa['subtitle_spelling_restored'] is True
          assert qa['dimensions']=='1080x1920'
          assert qa['video_codec']=='h264' and qa['audio_codec']=='aac'
          assert 45 <= qa['duration_seconds'] <= 90
          assert len(set(qa['source_links'])) == 7
          for field in ('editorial_approved','published','cloudinary_uploaded','instagram_published'):
              assert qa[field] is False
          assert Path('r72_review/marketrevamp-r72-real-news-review-only.mp4').stat().st_size>100000
          print('R72 daily editorial Reel candidate ONLY; no Instagram publishing')
          PY
      - name: Save draft Reel, citations, source review and QA as GitHub artifacts
        if: always() && steps.local_day.outputs.run_review == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketrevamp-r72-fresh-news-draft-not-published
          path: |
            r67_review/review_sources.json
            r72_review/editorial_pending_stories.json
            r72_review/r72_qa.json
            r72_review/r72_contact_sheet.png
            r72_review/r72_subtitles.ass
            r72_review/marketrevamp-r72-real-news-review-only.mp4
          retention-days: 7
          if-no-files-found: warn
