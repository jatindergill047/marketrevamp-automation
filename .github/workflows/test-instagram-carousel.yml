name: Test Instagram Carousel (Offline)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-carousel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - name: Validate seven-slide and review gate without network or credentials
        run: python -m unittest -v test_seven_pipeline.py test_approved_workflow.py test_publish_retry.py
