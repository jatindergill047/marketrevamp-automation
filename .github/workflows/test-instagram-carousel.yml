
name: Test Instagram Carousel

on:
  workflow_dispatch:
  
permissions:
  contents: read
  actions: read

jobs:
  test-carousel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest carousel manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow marketrevamp.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "No successful MarketRevamp run found."
            exit 1
          fi

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name marketrevamp-instagram-carousel \
            --dir .

      - name: Test carousel without publishing
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: "28265320583167958"
        run: python test_instagram_carousel.py
