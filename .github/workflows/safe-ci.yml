name: Safe Validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - run: python prepare_fonts.py
      - run: python -m compileall -q .
      - run: python -m unittest -v test_caption_format.py test_auto_publish_gate.py test_reliability.py test_history_reconcile.py test_approved_workflow.py test_editorial_config.py test_publish_retry.py test_news_quality.py test_seven_pipeline.py test_editorial_layout.py test_cloudinary_signing.py
      - run: python test_publishing_flow.py
      - run: python test_image_layout.py
      - run: python -m unittest -v test_quote_cards.py test_quote_first_live.py test_schedule_reliability.py
      - run: python run_quote_card_preview.py
      - run: python run_quote_first_preview.py
      - name: Upload synthetic quote-first integration preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketrevamp-quote-first-live-format-synthetic
          path: quote_first_preview/
          if-no-files-found: error
          retention-days: 7
      - name: Upload isolated quote-card experiment (never production images)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketrevamp-single-quote-test
          path: quote_card_trial/
          if-no-files-found: error
          retention-days: 7
      - name: Upload offline horizontal-logo preview for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketrevamp-horizontal-masthead-preview
          path: |
            marketrevamp_brand_preview.png
            marketrevamp_tokenization_preview.png
            marketrevamp_headline_answer_preview.png
          if-no-files-found: error
          retention-days: 7
      - run: python -m unittest -v test_news_quality.py
      - run: python -m unittest -v test_seven_pipeline.py
      - run: python -m unittest -v test_editorial_layout.py
      - name: Check dependency vulnerabilities
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.lock
      - name: Ruff critical lint checks
        run: |
          python -m pip install ruff==0.14.0
          ruff check --select E7,E9,F63,F7,F82 .
