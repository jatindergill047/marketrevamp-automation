name: Safe Validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - run: python prepare_fonts.py
      - run: python -m compileall -q .
      - run: python -m unittest -v test_reliability.py test_publish_retry.py test_news_quality.py test_seven_pipeline.py test_editorial_layout.py
      - run: python test_image_layout.py
      - run: python -m unittest -v test_news_quality.py
      - run: python -m unittest -v test_seven_pipeline.py
      - run: python -m unittest -v test_editorial_layout.py
      - name: Check dependency vulnerabilities
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.lock
      - name: Ruff critical lint checks
        run: |
          python -m pip install ruff==0.14.0
          ruff check --select E7,E9,F63,F7,F82 .
