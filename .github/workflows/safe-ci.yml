name: Safe Validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python prepare_fonts.py
      - run: python -m compileall -q .
      - run: python -m unittest -v test_reliability.py
      - run: python test_image_layout.py
      - run: python -m unittest -v test_news_quality.py
      - run: python -m unittest -v test_seven_pipeline.py
