name: R102 Reel Source CI and Deferred TTS Import (Never Publish)

on:
  push:
    branches:
      - feature/r102-lazy-tts-import-for-source-ci-20261121
      - feature/reels-opt-in
    paths:
      - reel_r72_review.py
      - .github/workflows/r102-source-ci.yml

permissions:
  contents: read

jobs:
  source-and-voice-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REEL_ENABLED: 'false'
      REEL_UPLOAD_ENABLED: 'false'
      REEL_FIRST_LIVE_ENABLED: 'false'
      INSTAGRAM_PUBLISH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install source dependencies without neural synthesis packages
        run: pip install -r requirements.lock
      - name: Confirm source QA tests do not import Edge TTS at module load
        run: |
          python -m unittest -v test_reel_editorial_quality.py test_r67_weekday_news.py test_news_quality.py
      - name: Install pinned neural narration dependencies and test safe retries
        run: |
          pip install -r requirements.reel.txt
          python -m unittest -v test_r97_neural_retry.py test_r72_news_review.py
          test "$REEL_ENABLED" = false
          test "$INSTAGRAM_PUBLISH_ENABLED" = false
      - name: Run syntax-critical lint
        run: |
          pip install ruff==0.14.0
          ruff check --select E7,E9,F63,F7,F82 reel_r72_review.py
