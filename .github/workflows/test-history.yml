name: Test Publishing History (Offline)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - name: Exercise local-only Git history and retry safeguards
        run: python -m unittest -v test_reliability.py test_history_reconcile.py test_publish_retry.py
