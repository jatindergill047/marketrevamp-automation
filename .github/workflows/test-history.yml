name: Test Publishing History (Offline)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - name: Exercise local-only Git history and retry safeguards
        run: python -m unittest -v test_reliability.py test_history_reconcile.py test_publish_retry.py
