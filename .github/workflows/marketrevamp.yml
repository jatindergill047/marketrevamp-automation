
name: MarketRevamp Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 1-5'
      timezone: 'America/Toronto'

jobs:
  collect-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect latest news
        run: python news_collector.py

      - name: Upload news results
        uses: actions/upload-artifact@v4
        with:
          name: marketrevamp-news
          path: news_results.json
          if-no-files-found: error
