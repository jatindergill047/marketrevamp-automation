
name: MarketRevamp Automation

on:
  workflow_dispatch:
  schedule:
    # 18:00 Toronto = 22:00 UTC (EDT) or 23:00 UTC (EST).
    - cron: '0 22 * * 1-5'
    - cron: '0 23 * * 1-5'

concurrency:
  group: marketrevamp-instagram-publishing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-latest
    environment: instagram-production

    env:
      INSTAGRAM_PUBLISH_ENABLED: 'true'
      INSTAGRAM_PERSISTENCE_READY: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check Toronto publishing window
        id: schedule
        run: python schedule_guard.py

      - name: Verify production branch
        if: steps.schedule.outputs.run == 'true'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "ERROR: Production workflow must run on main."
            exit 1
          fi
          echo "Production branch verified."

      - name: Checkout publishing history
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: publishing-history
          path: publishing-history
          persist-credentials: true

      - name: Restore Instagram publishing history
        if: steps.schedule.outputs.run == 'true'
        run: |
          cp publishing-history/instagram_publish_history.json instagram_publish_history.json

      - name: Set up Python
        if: steps.schedule.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.schedule.outputs.run == 'true'
        run: pip install -r requirements.lock

      - name: Install Playfair Display font
        if: steps.schedule.outputs.run == 'true'
        run: python prepare_fonts.py

      - name: Test scheduling and publishing-history safeguards
        if: steps.schedule.outputs.run == 'true'
        run: python -m unittest -v test_reliability.py test_history_reconcile.py test_publish_retry.py test_news_quality.py test_seven_pipeline.py test_editorial_layout.py test_cloudinary_signing.py

      - name: Collect latest news and generate images
        if: steps.schedule.outputs.run == 'true'
        run: |
          python news_collector.py
          python image_generator.py

      - name: Upload images to Cloudinary
        if: steps.schedule.outputs.run == 'true'
        env:
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python upload_to_cloudinary.py

      - name: Prepare Instagram carousel
        if: steps.schedule.outputs.run == 'true'
        run: python prepare_instagram_carousel.py

      - name: Test duplicate article protection
        if: steps.schedule.outputs.run == 'true'
        run: python test_duplicate_articles.py

      - name: Test Instagram container history
        if: steps.schedule.outputs.run == 'true'
        run: python test_container_history.py

      - name: Test full Instagram publishing simulation
        if: steps.schedule.outputs.run == 'true'
        run: python test_publishing_flow.py

      - name: Validate Instagram carousel publishing
        if: steps.schedule.outputs.run == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          INSTAGRAM_APPROVED_FINGERPRINT: ${{ vars.INSTAGRAM_APPROVED_FINGERPRINT }}
        run: python publish_instagram.py

      - name: Save Instagram carousel manifest
        if: steps.schedule.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketrevamp-instagram-carousel
          path: instagram_carousel_manifest.json
          if-no-files-found: error

      - name: Save Cloudinary URLs
        if: steps.schedule.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketrevamp-cloudinary-urls
          path: cloudinary_uploads.json
          if-no-files-found: error

      - name: Upload news results
        if: steps.schedule.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketrevamp-news
          path: news_results.json
          if-no-files-found: error

      - name: Upload Instagram images
        if: steps.schedule.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketrevamp-images
          path: instagram_images/
          if-no-files-found: error

      - name: Report failed publishing workflow
        if: ${{ failure() && steps.schedule.outputs.run == 'true' }}
        env:
          FAILURE_WEBHOOK_URL: ${{ secrets.FAILURE_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "MarketRevamp publishing failed: $RUN_URL" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$FAILURE_WEBHOOK_URL" ]; then
            python - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({"text": "MarketRevamp production failed: " + os.environ["RUN_URL"]}).encode()
          request = urllib.request.Request(
              os.environ["FAILURE_WEBHOOK_URL"], data=payload,
              headers={"Content-Type": "application/json"}, method="POST")
          urllib.request.urlopen(request, timeout=15).close()
          PY
          fi
