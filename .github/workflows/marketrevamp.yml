
name: MarketRevamp Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 1-5'
      timezone: 'America/Toronto'

jobs:
  collect-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Collect latest news and generate images
        run: |
          python news_collector.py
          python image_generator.py

      - name: Upload news results
        uses: actions/upload-artifact@v4
        with:
          name: marketrevamp-news
          path: news_results.json
          if-no-files-found: error
          
      - name: Upload Instagram images
        uses: actions/upload-artifact@v4
        with:
          name: marketrevamp-images
          path: instagram_images/
          if-no-files-found: error
