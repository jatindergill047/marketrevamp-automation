name: R84 MarketRevamp Verified Reel Publisher (Controlled Rollout)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful same-day R72 real-news draft Actions run ID'
        required: true
        type: string
      approved_video_sha256:
        description: 'Exact reviewed MP4 SHA-256 for first controlled release'
        required: true
        type: string
      confirmation:
        description: 'Enter PUBLISH_VERIFIED_R72 for a gated first-live release'
        required: true
        type: string
  push:
    branches: [main]
    paths: ['.github/r92-controlled-first-reel.trigger']
  workflow_run:
    workflows: ['MarketRevamp R72 Daily News Reel Draft (Never Publish)']
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: marketrevamp-instagram-publishing
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.policy.outputs.enabled }}
      mode: ${{ steps.policy.outputs.mode }}
      source_run_id: ${{ steps.policy.outputs.source_run_id }}
      approved_sha: ${{ steps.policy.outputs.approved_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Enforce first-live and recurring disable switches
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_JOB_ID: ${{ github.event.workflow_run.id }}
          SOURCE_JOB_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_JOB_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_JOB_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_JOB_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          EXPECTED_REPO: ${{ github.repository }}
          USER_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          USER_APPROVED_SHA: ${{ inputs.approved_video_sha256 }}
          USER_CONFIRMATION: ${{ inputs.confirmation }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import json, os, re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          data=json.loads(Path('r83_reel_autopublish_state.json').read_text())
          enabled=False
          mode=''
          source=''
          sha=''
          event=os.getenv('EVENT_NAME')
          if os.getenv('CURRENT_REF')=='refs/heads/main' and data.get('owner_authorized') is True and data.get('policy')=='owner_authorized_source_attribution_v1':
              if event=='push':
                  trigger_path=Path('.github/r92-controlled-first-reel.trigger')
                  if trigger_path.is_file():
                      trigger=json.loads(trigger_path.read_text())
                      today=datetime.now(ZoneInfo('America/Toronto')).date().isoformat()
                      expected={'intent':'one-time-controlled-R72-first-live',
                                'toronto_date':today,
                                'source_run_id':trigger.get('source_run_id'),
                                'approved_video_sha256':trigger.get('approved_video_sha256'),
                                'publish_to_instagram':True}
                      mode='first'
                      source=str(trigger.get('source_run_id',''))
                      sha=str(trigger.get('approved_video_sha256',''))
                      enabled=(trigger==expected and
                               data.get('controlled_first_live') is True and
                               data.get('daily_enabled') is False and
                               data.get('first_video_sha256')==sha and
                               re.fullmatch(r'[a-f0-9]{64}',sha) is not None and
                               source.isdigit())
              elif event=='workflow_dispatch':
                  mode='first'
                  source=os.getenv('USER_SOURCE_RUN_ID','')
                  sha=os.getenv('USER_APPROVED_SHA','')
                  enabled=(data.get('controlled_first_live') is True and
                           data.get('first_video_sha256')==sha and
                           re.fullmatch(r'[a-f0-9]{64}', sha) is not None and
                           source.isdigit() and
                           os.getenv('USER_CONFIRMATION')=='PUBLISH_VERIFIED_R72')
              elif event=='workflow_run':
                  mode='daily'
                  source=os.getenv('SOURCE_JOB_ID','')
                  enabled=(data.get('daily_enabled') is True and
                           bool(str(data.get('verified_first_media_id','')).isdigit()) and
                           os.getenv('SOURCE_JOB_EVENT') in ('schedule','workflow_dispatch') and
                           os.getenv('SOURCE_JOB_CONCLUSION')=='success' and
                           os.getenv('SOURCE_JOB_BRANCH')=='main' and
                           os.getenv('SOURCE_JOB_REPO')==os.getenv('EXPECTED_REPO') and
                           source.isdigit())
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('enabled='+str(enabled).lower()+'\n')
              output.write('mode='+mode+'\n')
              output.write('source_run_id='+source+'\n')
              output.write('approved_sha='+sha+'\n')
          print('R84 gate status:', 'enabled' if enabled else 'disabled',
                'mode:',mode if mode else 'none')
          PY

  publish-reel:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: instagram-production
    timeout-minutes: 38
    env:
      REEL_FIRST_LIVE_ENABLED: 'true'
      REEL_UPLOAD_ENABLED: 'true'
      INSTAGRAM_PUBLISH_ENABLED: 'true'
      INSTAGRAM_PERSISTENCE_READY: 'true'
      CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_REEL_UPLOAD_PRESET: ${{ vars.CLOUDINARY_REEL_UPLOAD_PRESET }}
      CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
      SOURCE_RUN_ID: ${{ needs.gate.outputs.source_run_id }}
      RELEASE_MODE: ${{ needs.gate.outputs.mode }}
      APPROVED_SHA256: ${{ needs.gate.outputs.approved_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout production Reel release policy code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned publisher and video QA dependencies
        run: |
          pip install -r requirements.lock
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Verify exact, successful, current-day source workflow
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > r84_source_run.json
          python - <<'PY'
          import json,os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          r=json.load(open('r84_source_run.json'))
          now=datetime.now(ZoneInfo('America/Toronto')).date()
          created=datetime.fromisoformat(r['created_at'].replace('Z','+00:00')).astimezone(ZoneInfo('America/Toronto')).date()
          if (r.get('name')!='MarketRevamp R72 Daily News Reel Draft (Never Publish)' or
              r.get('conclusion')!='success' or r.get('head_branch')!='main' or
              r.get('head_repository',{}).get('full_name')!=os.environ['GITHUB_REPOSITORY'] or
              created!=now or
              (os.environ['RELEASE_MODE']=='daily' and r.get('event') not in ('schedule','workflow_dispatch'))):
              raise RuntimeError('Reel source run not authenticated/current/successful')
          print('Exact current-day source run trusted:',r['id'])
          PY
      - name: Download original review-only MP4 and publisher citation artifacts
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name marketrevamp-r72-fresh-news-draft-not-published --dir .
          test -s r72_review/marketrevamp-r72-real-news-review-only.mp4
          test -s r72_review/r72_qa.json
          test -s r72_review/editorial_pending_stories.json
          test -s r67_review/review_sources.json
      - name: Checkout durable cross-carousel publishing history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: publishing-history
          path: publishing-history
          persist-credentials: true
      - name: Restore history and run no-network release safety regression
        run: |
          cp publishing-history/instagram_publish_history.json instagram_publish_history.json
          python -m unittest -v test_reel_daily_release_policy.py test_reel_r84_publish_job.py test_reel_r46_launch_gate.py test_reel_r49_first_live.py
      - name: Prepare exact source-backed, policy-authorized release with zero media API calls
        run: |
          python reel_r84_publish_job.py \
            --mode "$RELEASE_MODE" --action prepare --approved-sha256 "$APPROVED_SHA256"
      - name: Execute one Cloudinary video upload and one Instagram publish with durable checkpoints
        run: |
          python reel_r84_publish_job.py \
            --mode "$RELEASE_MODE" --action publish --approved-sha256 "$APPROVED_SHA256"
      - name: Save verified Instagram media readback and exact release evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r84-verified-instagram-reel-release
          path: |
            r84_release/publication_result.json
            r84_release/release_gate.json
          retention-days: 14
          if-no-files-found: error
