name: MarketRevamp Reel Opt-in Validation

on:
  workflow_dispatch:
  push:
    branches: [feature/reels-opt-in]
    paths:
      - 'reel_*.py'
      - 'prepare_reel.py'
      - 'test_reel_*.py'
      - 'test_prepare_reel.py'
      - 'test_reel_integration.py'
      - 'requirements.reel.txt'
      - 'REELS_RUNBOOK.md'
      - 'REEL_PROGRESS.md'
      - '.github/workflows/reel-opt-in-validation.yml'

permissions:
  contents: read

jobs:
  validate-reel:
    runs-on: ubuntu-latest
    env:
      REEL_ENABLED: 'false'
      REEL_UPLOAD_ENABLED: 'false'
      INSTAGRAM_PUBLISH_ENABLED: 'false'
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install existing pinned dependencies
        run: pip install -r requirements.lock
      - name: Install optional pinned Reel TTS dependency
        run: pip install -r requirements.reel.txt && pip check
      - name: Run offline Reel safety checks
        run: |
          python -m unittest -v test_reel_config.py test_reel_script.py test_tts.py test_reel_frames.py test_build_reel.py test_reel_cloudinary.py test_reel_manifest.py test_reel_security.py test_reel_publish.py test_prepare_reel.py test_reel_recovery.py test_reel_launch_docs.py
          python -m compileall -q prepare_reel.py reel_config.py reel_script.py tts.py reel_frames.py build_reel.py reel_cloudinary.py reel_manifest.py reel_security.py reel_publish.py
      - name: Run existing carousel regression checks
        run: |
          python -m unittest -v test_auto_publish_gate.py test_reliability.py test_publish_retry.py
          python test_publishing_flow.py
      - name: Install FFmpeg and FFprobe for R11
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Run R11 synthetic MP4 and mocked Cloudinary integration
        run: python -m unittest -v test_reel_integration.py
      - name: R13 real TTS staging smoke (external service; no uploads)
        id: r13_voice
        continue-on-error: true
        timeout-minutes: 12
        run: python reel_staging_smoke.py
      - name: Report R13 external voice status
        if: always()
        run: |
          echo 'R13 real voice outcome: ${{ steps.r13_voice.outcome }}'
          echo 'External voice failures do not imply staging approval.'
      - name: Verify disabled Reel path
        run: python prepare_reel.py
