name: R84 Reel First-Live and Daily Publisher Contract (No Network)

on:
  pull_request:
    paths:
      - r83_reel_autopublish_state.json
      - reel_rollout_state.py
      - test_reel_rollout_state.py
      - reel_r92_release_gate.py
      - test_reel_r92_release_gate.py
      - reel_r84_publish_job.py
      - test_reel_r84_publish_job.py
      - .github/workflows/r84-verified-reel-publisher.yml
      - .github/workflows/r84-release-contract.yml
  push:
    branches: [feature/r84-controlled-first-reel-delivery-20261121, feature/r96-state-aware-reel-activation-ci-20261121]
    paths:
      - r83_reel_autopublish_state.json
      - reel_rollout_state.py
      - test_reel_rollout_state.py
      - reel_r92_release_gate.py
      - test_reel_r92_release_gate.py
      - reel_r84_publish_job.py
      - test_reel_r84_publish_job.py
      - .github/workflows/r84-verified-reel-publisher.yml
      - .github/workflows/r84-release-contract.yml

permissions:
  contents: read

jobs:
  offline-delivery-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REEL_ENABLED: 'false'
      REEL_FIRST_LIVE_ENABLED: 'false'
      REEL_UPLOAD_ENABLED: 'false'
      INSTAGRAM_PUBLISH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install only existing pinned API dependencies
        run: pip install -r requirements.lock
      - name: Validate owner-approved stage machine without public network calls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from reel_rollout_state import rollout_state_valid
          a=json.loads(Path('r83_reel_autopublish_state.json').read_text())
          print('Offline R84 stage:', rollout_state_valid(a))
          PY
          test "$REEL_ENABLED" = false
          test "$REEL_FIRST_LIVE_ENABLED" = false
          test "$REEL_UPLOAD_ENABLED" = false
          test "$INSTAGRAM_PUBLISH_ENABLED" = false
      - name: Run production release, readback and durable-history offline mocks
        run: |
          python -m py_compile reel_rollout_state.py test_reel_rollout_state.py reel_r92_release_gate.py test_reel_r92_release_gate.py reel_r84_publish_job.py test_reel_r84_publish_job.py
          python -m unittest -v test_reel_rollout_state.py test_reel_r92_release_gate.py test_reel_r84_publish_job.py test_reel_daily_release_policy.py test_reel_r49_first_live.py test_reel_r46_launch_gate.py
      - name: Critical Python lint
        run: |
          pip install ruff==0.14.0
          ruff check --select E7,E9,F63,F7,F82 reel_rollout_state.py test_reel_rollout_state.py reel_r92_release_gate.py test_reel_r92_release_gate.py reel_r84_publish_job.py test_reel_r84_publish_job.py
