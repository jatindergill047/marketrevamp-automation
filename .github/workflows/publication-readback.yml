name: MarketRevamp Publication Readback Reconciliation
on:
  schedule:
    - cron: '47 19 * * *'
      timezone: 'America/Toronto'
permissions:
  contents: write
concurrency:
  group: marketrevamp-instagram-publishing
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: instagram-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: publishing-history
          path: publishing-history
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - run: python -m unittest -v test_publication_readback.py test_publication_recovery.py
      - name: Reconcile exact known media IDs only
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          test -s publishing-history/instagram_publish_history.json
          cp publishing-history/instagram_publish_history.json instagram_publish_history.json
          python publication_readback.py
