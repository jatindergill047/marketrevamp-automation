name: R68 Animated 2D Artwork Reel Review (Never Publish)

on:
  push:
    branches: [feature/reels-opt-in]
    paths:
      - 'reel_artwork.py'
      - 'reel_bookends.py'
      - 'test_reel_bookends.py'
      - 'reel_r51_design.py'
      - 'reel_r50_review.py'
      - 'reel_r52_review.py'
      - 'reel_clean_end_to_end_review.py'
      - 'test_reel_artwork.py'
      - 'test_reel_r51_design.py'
      - '.github/workflows/r68-animated-artwork-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artwork-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REEL_ENABLED: 'false'
      REEL_UPLOAD_ENABLED: 'false'
      REEL_FIRST_LIVE_ENABLED: 'false'
      INSTAGRAM_PUBLISH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Gate preview-only branch and publication controls
        run: |
          test "$GITHUB_REF" = 'refs/heads/feature/reels-opt-in'
          test "$REEL_ENABLED" = false
          test "$REEL_UPLOAD_ENABLED" = false
          test "$REEL_FIRST_LIVE_ENABLED" = false
          test "$INSTAGRAM_PUBLISH_ENABLED" = false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install offline rendering dependencies
        run: |
          pip install -r requirements.lock
          pip install -r requirements.reel.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Compile and test the 2D artwork and subtitle integration
        run: |
          python -m py_compile reel_artwork.py reel_bookends.py reel_r51_design.py reel_r50_review.py reel_r52_review.py reel_clean_end_to_end_review.py
          python -m unittest -v test_reel_artwork.py test_reel_r51_design.py test_reel_bookends.py
      - name: Build narrated seven-scene artwork Reel, without publishing
        timeout-minutes: 16
        run: python reel_clean_end_to_end_review.py
      - name: Verify actual animation, subtitle layout, audio and safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reel_clean_review/QA.json').read_text())
          assert d['status']=='review_only' and d['synthetic_content'] is True
          assert d['seven_scenes']==len(d['artwork_themes'])==7
          assert d['presentation_segments']==9
          assert d['spoken_hook']=="Here's what's making headlines today."
          assert d['spoken_follow_cta'].startswith('Follow MarketRevamp')
          assert d['duration_seconds'] <= 90
          assert len(set(d['artwork_themes'])) >= 4
          assert d['artwork_animation']=='subtle_vertical_float_8px'
          assert d['caption_font_size_px']==80
          assert d['subtitle_placement']=='below_artwork'
          assert d['key_detail_visible'] is False
          assert d['alignment_token_ratio']>=.90
          assert d['video_codec']=='h264' and d['audio_codec']=='aac'
          assert d['dimensions']=='1080x1920'
          assert all(d[k] is False for k in ('editorial_approved','published','cloudinary_uploaded','instagram_published'))
          print('R68 review-only 2D animated artwork QA PASS')
          PY
          EARLY=$(python -c "import json; q=json.load(open('reel_clean_review/QA.json')); print(q['intro_seconds']+0.5)")
          LATER=$(python -c "import json; q=json.load(open('reel_clean_review/QA.json')); print(q['intro_seconds']+2.0)")
          ffmpeg -y -loglevel error -ss "$EARLY" -i reel_clean_review/marketrevamp-clean-reel-review-only.mp4 -frames:v 1 reel_clean_review/artwork_early.png
          ffmpeg -y -loglevel error -ss "$LATER" -i reel_clean_review/marketrevamp-clean-reel-review-only.mp4 -frames:v 1 reel_clean_review/artwork_later.png
          python - <<'PY'
          from PIL import Image, ImageChops
          from reel_artwork import ARTWORK_ZONE, SUBTITLE_ZONE
          base='reel_clean_review/'
          with Image.open(base+'artwork_early.png') as a, Image.open(base+'artwork_later.png') as b:
              motion=ImageChops.difference(a.crop(ARTWORK_ZONE), b.crop(ARTWORK_ZONE))
              assert motion.getbbox(), 'Artwork is static in final MP4'
              assert ARTWORK_ZONE[3] < SUBTITLE_ZONE[1] < SUBTITLE_ZONE[3] < 1605
              assert a.size==b.size==(1080,1920)
          print('Verified visible animation in final H264 MP4 and separation from captions')
          PY
      - name: Preserve preview video and artwork QA files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r68-animated-carousel-artwork-reel-review
          path: |
            reel_clean_review/marketrevamp-clean-reel-review-only.mp4
            reel_clean_review/contact_sheet.png
            reel_clean_review/subtitles.ass
            reel_clean_review/QA.json
            reel_clean_review/artwork_early.png
            reel_clean_review/artwork_later.png
            reel_clean_review/R50_artwork_*.png
          retention-days: 7
          if-no-files-found: warn
