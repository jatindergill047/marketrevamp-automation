name: MarketRevamp R51 Editorial Reel Design (Offline Review)

on:
  push:
    branches: [feature/reels-opt-in]
    paths:
      - 'reel_r51_design.py'
      - 'test_reel_r51_design.py'
      - 'reel_r50_review.py'
      - '.github/workflows/reel-r51-design.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REEL_ENABLED: 'false'
      REEL_UPLOAD_ENABLED: 'false'
      REEL_FIRST_LIVE_ENABLED: 'false'
      INSTAGRAM_PUBLISH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install only isolated design dependencies
        run: pip install pillow
      - name: Compile design and editorial builder
        run: python -m py_compile reel_r51_design.py reel_r50_review.py test_reel_r51_design.py
      - name: Validate unchanged speech timings, enlarged captions and safe zones
        run: python -m unittest -v test_reel_r51_design.py
      - name: Check editorial builder actually uses approved R51 design
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('reel_r50_review.py').read_text()
          assert 'from reel_r51_design import style_scene, enlarge_subtitles' in s
          assert 'style_scene(dest, story["deck"], dest)' in s
          assert 'enlarge_subtitles(ass_path, ass_path)' in s
          print('R51 layout integrated with R50-style editorial renderer')
          PY
