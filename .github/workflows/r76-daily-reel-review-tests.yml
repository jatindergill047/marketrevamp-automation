name: R76 Seven-Day Reel Draft Source Gate (Never Publish)

on:
  push:
    branches:
      - feature/r76-daily-reel-drafts-seven-days-20261121
      - feature/reels-opt-in
    paths:
      - r67_weekday_news.py
      - reel_r72_review.py
      - test_r67_weekday_news.py
      - test_r72_news_review.py
      - .github/workflows/r76-daily-reel-review-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekend-and-weekday:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REEL_ENABLED: 'false'
      REEL_UPLOAD_ENABLED: 'false'
      REEL_FIRST_LIVE_ENABLED: 'false'
      INSTAGRAM_PUBLISH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install source and visual dependencies
        run: |
          pip install -r requirements.lock
          pip install -r requirements.reel.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Validate weekend and weekday screening, history and narration budget
        run: |
          test "$REEL_ENABLED" = false
          test "$REEL_UPLOAD_ENABLED" = false
          test "$REEL_FIRST_LIVE_ENABLED" = false
          test "$INSTAGRAM_PUBLISH_ENABLED" = false
          python -m py_compile r67_weekday_news.py reel_r72_review.py
          python -m unittest -v test_r67_weekday_news.py test_r72_news_review.py test_reel_bookends.py test_r68_design_contract.py
      - name: Run critical Python syntax and security lint checks
        run: |
          python -m pip install ruff==0.14.0
          ruff check --select E7,E9,F63,F7,F82 r67_weekday_news.py reel_r72_review.py test_r67_weekday_news.py test_r72_news_review.py
