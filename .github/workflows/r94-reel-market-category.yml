name: R94 Reel Topic Classification — Review Only

on:
  push:
    branches:
      - feature/r94-reel-prediction-market-category-20261121
      - feature/reels-opt-in
    paths:
      - reel_editorial_quality.py
      - news_collector.py
      - r67_weekday_news.py
      - test_reel_editorial_quality.py
      - test_r67_weekday_news.py
      - .github/workflows/r94-reel-market-category.yml
  pull_request:
    paths:
      - reel_editorial_quality.py
      - news_collector.py
      - r67_weekday_news.py
      - test_reel_editorial_quality.py
      - test_r67_weekday_news.py
      - .github/workflows/r94-reel-market-category.yml

permissions:
  contents: read

jobs:
  no-publish-news-category:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REEL_ENABLED: 'false'
      REEL_UPLOAD_ENABLED: 'false'
      REEL_FIRST_LIVE_ENABLED: 'false'
      INSTAGRAM_PUBLISH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned project dependencies
        run: pip install -r requirements.lock
      - name: Test category, dedup and unchanged carousel behavior
        run: |
          python -m py_compile reel_editorial_quality.py news_collector.py r67_weekday_news.py
          python -m unittest -v test_reel_editorial_quality.py test_r67_weekday_news.py test_news_quality.py
          test "$REEL_ENABLED" = false
          test "$REEL_UPLOAD_ENABLED" = false
          test "$REEL_FIRST_LIVE_ENABLED" = false
          test "$INSTAGRAM_PUBLISH_ENABLED" = false
      - name: Critical security lint
        run: |
          pip install ruff==0.14.0
          ruff check --select E7,E9,F63,F7,F82 reel_editorial_quality.py news_collector.py r67_weekday_news.py test_reel_editorial_quality.py
