name: MarketRevamp R47 Instagram Reel Container Staging (Never Publish)

on:
  push:
    branches: [feature/reels-opt-in]
    paths: ['.github/r47-container.trigger']
  workflow_dispatch:
    inputs:
      confirmation:
        required: true
        description: 'Type CONTAINER_ONLY to test Instagram processing without publication'
        type: string

permissions:
  contents: read

jobs:
  upload-test-media:
    if: >-
      github.ref == 'refs/heads/feature/reels-opt-in' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirmation == 'CONTAINER_ONLY') ||
       github.event_name == 'push')
    runs-on: ubuntu-latest
    environment: reels-staging
    timeout-minutes: 18
    outputs:
      video_url: ${{ steps.upload.outputs.video_url }}
    env:
      REEL_ENABLED: 'false'
      REEL_UPLOAD_ENABLED: 'false'
      INSTAGRAM_PUBLISH_ENABLED: 'false'
      CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate R47 isolated push authorization
        if: github.event_name == 'push'
        run: |
          test "$(cat .github/r47-container.trigger)" = 'R47_CONTAINER_ONLY_NO_PUBLICATION_2026-11-20'
      - name: Enforce Cloudinary staging configuration
        run: |
          test "$CLOUDINARY_UPLOAD_PRESET" = 'marketrevamp_reels_staging'
          test -n "$CLOUDINARY_CLOUD_NAME"
          test -n "$CLOUDINARY_API_KEY"
          test -n "$CLOUDINARY_API_SECRET"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install video dependencies
        run: |
          pip install -r requirements.lock
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Upload nine-second non-news test video to Cloudinary
        id: upload
        run: python reel_staging_upload.py

  inspect-instagram-container:
    needs: upload-test-media
    runs-on: ubuntu-latest
    environment: instagram-production
    timeout-minutes: 14
    env:
      REEL_ENABLED: 'false'
      REEL_UPLOAD_ENABLED: 'false'
      INSTAGRAM_PUBLISH_ENABLED: 'false'
      REEL_STAGING_PUBLIC_URL: ${{ needs.upload-test-media.outputs.video_url }}
      INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install existing API dependencies
        run: pip install -r requirements.lock
      - name: Prove media_publish is unreachable from smoke test
        run: python -m unittest -v test_reel_r47_container_smoke.py
      - name: Create Reel container and await processing (never publish)
        run: python reel_r47_container_smoke.py
      - name: Save processing-only result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketrevamp-r47-reel-container-nonpublished
          path: reel_r47_container_result.json
          retention-days: 7
          if-no-files-found: error
