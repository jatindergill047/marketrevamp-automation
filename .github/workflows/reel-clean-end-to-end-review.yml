name: MarketRevamp Clean Reel Full MP4 Review (Never Publish)

on:
  push:
    branches: [feature/reel-clean-final-render-20261120]
    paths:
      - 'reel_clean_end_to_end_review.py'
      - 'reel_r50_review.py'
      - 'reel_r51_design.py'
      - 'test_reel_r51_design.py'
      - '.github/workflows/reel-clean-end-to-end-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-only-mp4:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REEL_ENABLED: 'false'
      REEL_UPLOAD_ENABLED: 'false'
      REEL_FIRST_LIVE_ENABLED: 'false'
      INSTAGRAM_PUBLISH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enforce experimental branch and never-publish gate
        run: |
          test "$GITHUB_REF" = 'refs/heads/feature/reel-clean-final-render-20261120'
          test "$REEL_ENABLED" = false
          test "$REEL_UPLOAD_ENABLED" = false
          test "$REEL_FIRST_LIVE_ENABLED" = false
          test "$INSTAGRAM_PUBLISH_ENABLED" = false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install isolated review dependencies
        run: |
          pip install -r requirements.lock
          pip install -r requirements.reel.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Compile and run design regressions
        run: |
          python -m py_compile reel_clean_end_to_end_review.py reel_r50_review.py reel_r51_design.py
          python -m unittest -v test_reel_r51_design.py
      - name: Build fully narrated synthetic 7-scene 9x16 MP4
        timeout-minutes: 16
        run: python reel_clean_end_to_end_review.py
      - name: Assert MP4 QA and publication controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reel_clean_review/QA.json')
          d=json.loads(p.read_text())
          assert d['status']=='review_only' and d['synthetic_content'] is True
          assert d['key_detail_visible'] is False
          assert d['seven_scenes']==7
          assert d['caption_font_size_px']==72
          assert d['tts_word_boundaries'] >= 160
          assert d['alignment_token_ratio'] >= .90
          assert d['video_codec']=='h264' and d['audio_codec']=='aac'
          assert d['dimensions']=='1080x1920'
          assert all(d[k] is False for k in ('editorial_approved','published','cloudinary_uploaded','instagram_published'))
          assert Path('reel_clean_review/marketrevamp-clean-reel-review-only.mp4').stat().st_size > 100000
          print('Full MP4 safety and technical gates PASS')
          PY
      - name: Upload synthetic preview MP4, subtitles, contact sheet and QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketrevamp-clean-reel-end-to-end-review
          path: |
            reel_clean_review/marketrevamp-clean-reel-review-only.mp4
            reel_clean_review/contact_sheet.png
            reel_clean_review/subtitles.ass
            reel_clean_review/QA.json
          retention-days: 7
          if-no-files-found: warn
