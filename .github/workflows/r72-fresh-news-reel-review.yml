name: R72 Daily Fresh News Reel Review — Editorial Only

on:
  push:
    branches:
      - feature/r72-real-news-reel-review-pipeline-20261121
      - feature/reels-opt-in
    paths:
      - 'r67_weekday_news.py'
      - 'reel_r72_review.py'
      - 'reel_r50_review.py'
      - 'news_collector.py'
      - 'test_r72_news_review.py'
      - 'test_r67_weekday_news.py'
      - '.github/workflows/r72-fresh-news-reel-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-to-reel-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REEL_ENABLED: 'false'
      REEL_UPLOAD_ENABLED: 'false'
      REEL_FIRST_LIVE_ENABLED: 'false'
      INSTAGRAM_PUBLISH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned offline dependencies
        run: |
          pip install -r requirements.lock
          pip install -r requirements.reel.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Verify R67 history path, fresh-day approval gates and R71 Reel integration
        run: |
          python -m py_compile r67_weekday_news.py reel_r72_review.py news_collector.py reel_r50_review.py
          python -m unittest -v test_r67_weekday_news.py test_r72_news_review.py test_reel_bookends.py test_r68_design_contract.py
          test "$REEL_ENABLED" = false
          test "$REEL_UPLOAD_ENABLED" = false
          test "$REEL_FIRST_LIVE_ENABLED" = false
          test "$INSTAGRAM_PUBLISH_ENABLED" = false
      - name: Critical lint and source/caption safety checks
        run: |
          pip install ruff==0.14.0
          ruff check --select E7,E9,F63,F7,F82 r67_weekday_news.py reel_r72_review.py test_r72_news_review.py

  live-daily-source-review:
    if: github.event_name == 'workflow_dispatch'
    needs: source-to-reel-offline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REEL_ENABLED: 'false'
      REEL_UPLOAD_ENABLED: 'false'
      REEL_FIRST_LIVE_ENABLED: 'false'
      INSTAGRAM_PUBLISH_ENABLED: 'false'
      MARKETREVAMP_QUOTE_FIRST: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Confirm production publishing is disabled on all seven days
        run: |
          test "$REEL_ENABLED" = false
          test "$REEL_UPLOAD_ENABLED" = false
          test "$REEL_FIRST_LIVE_ENABLED" = false
          test "$INSTAGRAM_PUBLISH_ENABLED" = false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: publishing-history
          path: publishing-history
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned source and Reel dependencies
        run: |
          pip install -r requirements.lock
          pip install -r requirements.reel.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Select seven fresh articles with published-history dedup
        run: |
          python r67_weekday_news.py --history publishing-history/instagram_publish_history.json \
            --output r67_review/review_sources.json
      - name: Generate R71-design Reel with fresh source-attributed scripts
        timeout-minutes: 17
        run: |
          python reel_r72_review.py \
            --sources r67_review/review_sources.json \
            --history publishing-history/instagram_publish_history.json \
            --output-dir r72_review
      - name: Fail closed unless exactly seven fresh, unapproved stories and valid MP4
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          qa=json.loads(Path("r72_review/r72_qa.json").read_text())
          candidates=json.loads(Path("r72_review/editorial_pending_stories.json").read_text())
          today=datetime.now(ZoneInfo("America/Toronto")).date().isoformat()
          assert qa["status"]=="review_only" and qa["toronto_date"]==today
          assert qa["seven_scenes"]==7 and qa["presentation_segments"]==9
          assert qa["spoken_hook"]=="Here's what's making headlines today."
          assert qa["spoken_follow_cta"].startswith("Follow MarketRevamp")
          assert qa["history_checked"] is True
          assert qa["not_independently_fact_checked"] is True
          assert qa["caption_font_size_px"]==80
          assert qa["subtitle_placement"]=="below_artwork"
          assert qa["alignment_token_ratio"]>=.90
          assert qa["dimensions"]=="1080x1920"
          assert qa["video_codec"]=="h264" and qa["audio_codec"]=="aac"
          assert 45 <= qa["duration_seconds"] <= 90
          assert len(candidates["stories"]) == 7
          assert len(set(qa["source_links"])) == 7
          for key in ("editorial_approved","published","cloudinary_uploaded","instagram_published"):
              assert qa[key] is False
          assert Path("r72_review/marketrevamp-r72-real-news-review-only.mp4").stat().st_size>100000
          print("R72 LIVE NEWS REVIEW-ONLY QA PASS. Editorial approval required before publishing.")
          PY
      - name: Upload editorial evidence — NEVER publish or upload to Cloudinary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketrevamp-r72-source-linked-news-reel-review-only
          path: |
            r67_review/review_sources.json
            r72_review/editorial_pending_stories.json
            r72_review/r72_qa.json
            r72_review/r72_contact_sheet.png
            r72_review/r72_subtitles.ass
            r72_review/marketrevamp-r72-real-news-review-only.mp4
          retention-days: 7
          if-no-files-found: warn
