name: Auto Publish MarketRevamp Carousel

on:
  workflow_run:
    workflows: ["MarketRevamp Automation"]
    types: [completed]
  # One-shot activation of the already-prepared Oct 19 package.
  # Simply changing code never triggers this; only creating the trigger
  # file on main does. The pinned Toronto date prevents later reuse.
  push:
    branches: [main]
    paths:
      - '.github/marketrevamp-post-now.trigger'

concurrency:
  group: marketrevamp-instagram-publishing
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish-automatically:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       (github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'push') &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: instagram-production
    env:
      PREPARATION_RUN_ID: ${{ github.event.workflow_run.id }}
      INSTAGRAM_PUBLISH_ENABLED: 'true'
      INSTAGRAM_PERSISTENCE_READY: 'true'
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: pip install -r requirements.lock

      - name: Select scheduled or one-shot source run
        run: python auto_publish_gate.py source

      - name: Verify successful same-day scheduled preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" |
            python auto_publish_gate.py verify-run

      - name: Checkout authoritative publishing history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: publishing-history
          path: publishing-history
          persist-credentials: true

      - name: Restore publishing history
        run: cp publishing-history/instagram_publish_history.json instagram_publish_history.json

      - name: Download exact prepared carousel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name marketrevamp-instagram-carousel --dir .
          test -s instagram_carousel_manifest.json

      - name: Run offline publishing safety checks
        run: |
          python -m unittest -v test_caption_format.py test_auto_publish_gate.py test_approved_workflow.py test_reliability.py test_history_reconcile.py test_publish_retry.py test_news_quality.py test_seven_pipeline.py test_cloudinary_signing.py
          python test_publishing_flow.py

      - name: Bind authorization to exact manifest and seven images
        run: python auto_publish_gate.py authorize

      - name: Publish once and checkpoint Instagram history
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
        run: python publish_instagram.py
