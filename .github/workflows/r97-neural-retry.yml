name: R97 Neural Reel Narration Resilience (No Publishing)

on:
  push:
    branches:
      - feature/r97-bounded-neural-voice-retries-20261121
      - feature/reels-opt-in
    paths:
      - reel_r72_review.py
      - test_r97_neural_retry.py
      - .github/workflows/r97-neural-retry.yml

permissions:
  contents: read

jobs:
  bounded-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REEL_ENABLED: 'false'
      REEL_UPLOAD_ENABLED: 'false'
      REEL_FIRST_LIVE_ENABLED: 'false'
      INSTAGRAM_PUBLISH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Reel voice and source dependencies
        run: |
          pip install -r requirements.lock
          pip install -r requirements.reel.txt
      - name: Validate transient voice failure returns no half-finished media
        run: |
          python -m py_compile reel_r72_review.py test_r97_neural_retry.py
          python -m unittest -v test_r97_neural_retry.py test_reel_bookends.py
          test "$INSTAGRAM_PUBLISH_ENABLED" = false
          test "$REEL_UPLOAD_ENABLED" = false
      - name: Critical Python syntax and undefined references
        run: |
          pip install ruff==0.14.0
          ruff check --select E7,E9,F63,F7,F82 reel_r72_review.py test_r97_neural_retry.py
